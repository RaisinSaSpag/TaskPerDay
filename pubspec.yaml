name: task_per_day
description: A minimalist daily planner for students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.9.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  google_fonts: ^6.1.0
  flutter_native_splash: ^2.3.8
  sqflite_common_ffi_web: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

# ═══════════════════════════════════════════════════════════
# APP ICON CONFIGURATION
# ═══════════════════════════════════════════════════════════
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/icon/logo.png"
    background_color: "#0A0E1A"
    theme_color: "#4A90D9"
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground: "assets/icon/logo.png"

# ═══════════════════════════════════════════════════════════
# NATIVE SPLASH SCREEN CONFIGURATION
# ═══════════════════════════════════════════════════════════
flutter_native_splash:
  color: "#0A0E1A"
  image: assets/icon/logo.png
  color_dark: "#0A0E1A"
  image_dark: assets/icon/logo.png
  android_12:
    color: "#0A0E1A"
    image: assets/icon/logo.png
    icon_background_color: "#0A0E1A"
    color_dark: "#0A0E1A"
    image_dark: assets/icon/logo.png
    icon_background_color_dark: "#0A0E1A"
  web: true
  android: true
  ios: true
  fullscreen: true